# DdbOperationType is the kind of DDB operation.
#
# The numeric codes behind these names are the ones the wire carries, so the order is part
# of the chain format and does not change.
enum DdbOperationType {
    CREATE_SCHEMA
    UPDATE_SCHEMA
    DELETE_SCHEMA
    CREATE_TABLE
    INSERT_DATA
    UPDATE_DATA
    DELETE_DATA
    CALL_PROCEDURE
    GRANT_ROLE
    REVOKE_ROLE

    # A code this build of the explorer does not recognise. The chain can introduce an
    # operation type before the explorer knows about it, and refusing to display an
    # otherwise-valid operation over one unfamiliar enum would be the wrong trade.
    UNKNOWN
}

# DdbOperation is a DDB operation committed on chain, with the quorum proof that
# authorised it.
#
# This is history the NODE CANNOT SERVE. It exposes no DDB history RPC at all --
# ddbEndorsementStatus and ddbConsensusStats are in-memory and reset on restart, and
# ddbSchema returns only current state -- so these records exist solely because the
# explorer captured them from the commit-transaction stream at ingest.
type DdbOperation {
    blockNumber: Long!
    txIndex: Long!
    txHash: Bytes32!

    # requestId is the operation's identity in the endorsement protocol.
    requestId: Bytes32!

    # requester submitted the operation for endorsement. Distinct from author, which is
    # what the operation payload itself declares.
    requester: Address!

    opType: DdbOperationType!

    schemaName: String
    contractAddress: Address
    contractName: String

    # version is a STRING on the wire -- "1", "1.2.0" -- not a number.
    version: String

    author: Address

    # payload is the operation JSON verbatim.
    #
    # This one stays dynamic ON PURPOSE, and it is the distinction worth drawing: the
    # operation's shape is USER-DEFINED (a CreateSchema carries table and column
    # definitions, an InsertData carries rows), so a fixed type would be a lie. Consensus
    # metadata has a fixed shape and is typed above; row data does not and is not.
    #
    # WITHHELD when the node will not serve this commit's calldata to an anonymous caller.
    # The operation JSON of a DDB commit IS the tenant's data -- the procedure arguments of
    # a CallProcedure op are the row values, and a deploy's definition is the contract's
    # tables, roles, reader accounts and procedure bodies -- so a contract that declares a
    # "reader" role, or has been tombstoned, has this field replaced by
    # "{withheld: {reason, schema, size, keccak256}}". CHECK "withheld" BELOW rather than
    # parsing this: the field is non-null either way, so a client that does not look will
    # read the descriptor as though it were the operation.
    payload: JSONAny!

    # withheld states why payload was not served, and is NULL when it was.
    #
    # This is the only "the data is here" signal a client should trust.
    withheld: DdbWithheld

    timestamp: Long!

    # endorsement is the validator quorum proof.
    endorsement: DdbEndorsement

    # transaction resolves the commit transaction that carried this operation.
    transaction: Transaction
}

# DdbWithheld describes transaction calldata this API did not serve.
#
# It mirrors the node's own "inputRedacted" descriptor field for field, so a client can treat the
# explorer's refusal and the node's as one thing. What it keeps is what an auditor still needs: how
# much was withheld, what it hashes to -- so a party who obtains the bytes through an authorized read
# (ddbSignedSelect) can bind them to the chain -- and why.
type DdbWithheld {
    # reason is "reader-role" (the contract declares a reader role), "tombstoned" (the contract was
    # deleted; the data still exists and the deletion is reversible), "undecodable" (the calldata
    # carries a DDB commit prefix but does not decode, so its contract cannot be named) or
    # "undecidable" (the node could not decide).
    #
    # The first three are verdicts on the CONTRACT. "undecidable" is a statement about the NODE -- the
    # block carrying the commit is above its contiguous applied frontier, the commit is still pending,
    # or its DDB is off or its PostgreSQL unreachable -- and is TRANSIENT: the same commit is served
    # verbatim once the node has applied its block, if the contract is public. Retry rather than cache.
    reason: String!

    # schema is the data-contract schema (db_name) the operation targets, when it could be resolved.
    #
    # For a deploy or an upgrade this is the schema its contract_address DERIVES, not the human
    # contract name the operation's schema_name carries.
    schema: String

    # size is the byte length of the withheld data, and keccak256 its hash.
    size: Long!
    keccak256: Bytes32!
}

# DdbEndorsement is the validator quorum proof that authorised an operation.
#
# The dual-consensus record the explorer previously could not show at all: it was decoded
# on every DDB transaction and discarded.
type DdbEndorsement {
    operationHash: Bytes32!
    dataHash: Bytes32!

    # stateHash is the PRIOR per-contract state hash the quorum signed against. Every
    # validator signature commits to it, which is what makes the per-contract hash chain
    # verifiable rather than merely asserted.
    stateHash: Bytes32!

    # The per-contract state-hash chain links.
    #
    # NULL for a contract's FIRST operation and for operations not scoped to a contract.
    # They are variable-length rather than fixed hashes precisely so that "no prior state"
    # is representable -- a fixed 32-byte type cannot express it, and declaring them
    # non-null would have made creating any data contract fail to index.
    priorPostStateHash: Bytes
    postStateHash: Bytes

    # epoch is the endorsing committee's epoch, used for the rotation grace window.
    epoch: Long!

    # validatorCount is the committee size; signatureCount is how many actually signed.
    # The ratio is the interesting number: a quorum that barely cleared threshold reads
    # very differently from a unanimous one.
    validatorCount: Int!
    signatureCount: Int!

    validatorSet: [Address!]!
}

# DdbContract is the current view of a data contract, folded from its operations.
type DdbContract {
    address: Address!

    # dbName is the contract's actual PostgreSQL schema name on the node.
    #
    # DERIVED, not carried on chain: lower(contractName) plus the last six hex characters
    # of the address. Surfaced because it is what an operator needs to find the data.
    dbName: String

    contractName: String

    # author, not owner. There is no owner field anywhere in the operation payload -- the
    # node's local metadata has one, but it is not chain-derived, so this explorer does not
    # claim it.
    author: Address

    latestVersion: String

    firstBlock: Long!
    lastBlock: Long!
    operationCount: Long!

    createdAt: Long!
    updatedAt: Long!

    # stateHashChainValid reports whether this contract's per-operation state-hash chain is
    # continuous: every operation's priorPostStateHash equals the previous operation's
    # postStateHash. This is the verification the endorsement's priorPostStateHash /
    # postStateHash fields imply -- false means a link is broken (tampering, or a gap in the
    # captured operation stream).
    stateHashChainValid: Boolean!

    # operations resolves this contract's operation history, newest first.
    operations(cursor: Cursor, count: Int = 25): [DdbOperation!]!
}

# DdbOperationList is a page of DDB operations.
type DdbOperationList {
    edges: [DdbOperationListEdge!]!
    pageInfo: ListPageInfo!
}

# DdbOperationListEdge is a single edge in a sequential list of DDB operations.
type DdbOperationListEdge {
    cursor: Cursor!
    operation: DdbOperation!
}

# DdbContractList is a page of data contracts.
type DdbContractList {
    edges: [DdbContractListEdge!]!
    pageInfo: ListPageInfo!
}

# DdbContractListEdge is a single edge in a sequential list of data contracts.
type DdbContractListEdge {
    cursor: Cursor!
    contract: DdbContract!
}

# SignedDdbReadInput is a client-signed ddb_signedSelect envelope: exactly the fields of the node's
# SignedDdbRead, all of them inside the signature (the chain-ID-bound NEC-DDB-READ preimage). Values
# are strings, forwarded exactly as sent.
input SignedDdbReadInput {
    "Contract db_name, as returned by ddbSchema."
    schemaName: String!

    "Base table of the read."
    tableName: String!

    "Every other table the query joins: sorted, no duplicates, excluding tableName."
    joinTables: [String!]

    "The reading account. Must be the address of callerPubKey."
    from: String!

    "Unix seconds, hex quantity."
    timestamp: String!

    "Single-use value, hex quantity."
    nonce: String!

    "Raw ML-DSA-87 public key, hex."
    callerPubKey: String!

    "ML-DSA-87 signature over the signed-read hash, hex, no EIP-191 prefix."
    callerSig: String!
}
