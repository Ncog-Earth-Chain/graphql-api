# Transaction is an Ncogearthchain block chain transaction.
type Transaction {
    # Hash is the unique hash of this transaction.
    hash: Bytes32!

    # Nonce is the number of transactions sent by the account prior to this transaction.
    nonce: Long!

    # Index is the index of this transaction in the block. This will
    # be null if the transaction is in a pending pool.
    index: Long

    # From is the address of the account that sent this transaction
    from: Address!

    # Sender is the account that sent this transaction
    sender: Account!

    # To is the account the transaction was sent to.
    # This is null for contract creating transactions.
    to: Address

    # contractAddress represents the address of smart contract
    # deployed by this transaction;
    # null if the transaction is not contract creation
    contractAddress: Address

    # Recipient is the account that received this transaction.
    # Null for contract creating transaction.
    recipient: Account

    # Value is the value sent along with this transaction in WEI.
    value: BigInt!

    # GasPrice is the price of gas per unit in WEI.
    gasPrice: BigInt!

    # Gas represents gas provided by the sender.
    gas: Long!

    # GasUsed is the amount of gas that was used on processing this transaction.
    # If the transaction is pending, this field will be null.
    gasUsed: Long

    # InputData is the data supplied to the target of the transaction.
    # Contains smart contract byte code if this is contract creation.
    # Contains encoded contract state mutating function call if recipient
    # is a contract address.
    inputData: Bytes!

    # BlockHash is the hash of the block this transaction was assigned to.
    # Null if the transaction is pending.
    blockHash: Bytes32

    # BlockHash is the hash of the block this transaction was assigned to.
    # Null if the transaction is pending.
    blockNumber: Long

    # Block is the block this transaction was assigned to. This will be null if
    # the transaction is pending.
    block: Block

    # Status is the return status of the transaction. This will be 1 if the
    # transaction succeeded, or 0 if it failed (due to a revert, or due to
    # running out of gas). If the transaction has not yet been processed, this
    # field will be null.
    status: Long

    # tokenTransactions represents a list of generic token transactions executed in the scope
    # of the transaction call; token type and transaction type is provided.
    tokenTransactions: [TokenTransaction!]!

    # erc20Transactions provides list of ERC-20 token transactions executed in the scope
    # of this blockchain transaction call.
    erc20Transactions: [ERC20Transaction!]!

    # erc721Transactions provides list of ERC-721 NFT transactions executed in the scope
    # of this blockchain transaction call.
    erc721Transactions: [ERC721Transaction!]!

    # erc1155Transactions provides list of ERC-1155 NFT transactions executed in the scope
    # of this blockchain transaction call.
    erc1155Transactions: [ERC1155Transaction!]!

    # internalTransactions provides a list of internal transactions (calls, creates, etc.)
    # executed as part of this transaction.
    #
    # ALWAYS read together with tracingAvailable. An empty list on its own is ambiguous: it means
    # either "no internal calls were made" or "nothing could be determined". Tracing requires the
    # node's optional debug namespace, and a node started without it can answer nothing here.
    internalTransactions: [InternalTransaction!]!

    # tracingAvailable reports whether the connected node could trace this transaction at all.
    #
    # False means internalTransactions is empty for lack of a tracer (the node does not serve
    # debug_traceTransaction), NOT because the transaction made no internal calls. Clients must
    # not present an empty list as "no internal transactions" while this is false.
    tracingAvailable: Boolean!

    # chainId is the chain this transaction was signed for.
    #
    # Mandatory on this chain: it is folded into the ML-DSA signing digest and the node
    # rejects a mismatch, so it is what prevents a transaction being replayed onto another
    # network. NULL only for transactions indexed before the node reported it.
    chainId: BigInt

    # sigVersion is the signature-scheme version: 2 = ML-DSA-87, 3 = ML-DSA-87 after key
    # rotation.
    #
    # Under rotation the signing key no longer hashes to the account address, so a client
    # that assumes address == keccak256(pubKey)[12:] would misreport key ownership.
    sigVersion: Int

    # signer resolves the cryptographic attribution of this transaction.
    #
    # ML-DSA has NO KEY RECOVERY. On an ECDSA chain anyone can ecrecover a transaction and
    # prove independently who sent it; here the public key is the only way, and this
    # explorer deliberately does not store public keys -- at ~2592 bytes each they would be
    # most of the database.
    #
    # So this field fetches the raw transaction from the node ON DEMAND and verifies it.
    # That is safe against a lying node because the verification is self-checking:
    # keccak256(rawTransaction) equals the transaction hash exactly, since the hash IS the
    # RLP hash of the same inner structure that carries the signature and public key. One
    # keccak proves the returned credentials belong to the transaction this explorer
    # already indexed.
    #
    # Returns NULL if the node cannot supply the raw transaction -- which requires a
    # full-history node with TxIndex enabled.
    signer: TransactionSigner

    # ddb resolves the DDB operation this transaction committed, if it is a DDB commit.
    #
    # Without this a DDB commit transaction is indistinguishable from a plain transfer to
    # the DDB system address -- which is exactly how it looked before, and why data-contract
    # activity was invisible in the explorer.
    ddb: DdbOperation
}
